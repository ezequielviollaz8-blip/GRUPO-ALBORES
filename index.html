<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="App del grupo Albores: repertorio, eventos, setlists y contactos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Albores</title>
<style>
:root{--bg:#050507;--card:rgba(22,22,26,.74);--card2:rgba(255,255,255,.045);--bd:rgba(255,255,255,.10);--tx:#f4efe6;--mu:#a8a297;--gold:#f2b33d;--gold2:#ffd27a;--goldbg:rgba(242,179,61,.13);--red:#ff6b5e;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:transparent}
body::before{content:"";position:fixed;inset:-40px;z-index:-1;background:url(fondo.jpg) center top/cover no-repeat;opacity:.16;filter:blur(16px)}
body.home::before{inset:0;opacity:1;filter:none}
#app{max-width:860px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card2);border-radius:14px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:disabled{opacity:.35}
button.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#1b1205;font-weight:700}
button.ghost{background:transparent;border-color:transparent}
button.on{background:var(--goldbg);border-color:var(--gold);color:var(--gold2);font-weight:600}
button.danger{color:var(--red)}
.ic{width:22px;height:22px;flex:none}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=tel],textarea,select{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
input[type=date],input[type=time]{color-scheme:dark}
select option{background:#151518}
textarea{min-height:50vh;resize:vertical;line-height:1.45}
label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.top{position:sticky;top:0;z-index:5;background:rgba(5,5,7,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd)}
.top h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sq{width:44px;padding:0}
.pad{padding:12px 14px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:14px;margin:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h2{display:flex;align-items:center;gap:10px;margin:2px 4px 10px;font-size:22px}
.card h2 .ic{color:var(--gold);width:26px;height:26px}
.card h2 span{flex:1}
.rb{width:44px;height:44px;border-radius:50%;padding:0;background:rgba(255,255,255,.06)}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:16px;padding:8px 6px 8px 8px;margin:8px 0}
.item .t{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.item .t b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--mu);font-size:14px}
.tile{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--goldbg);color:var(--gold2);display:grid;place-items:center;font-weight:700;flex:none}
.star{color:var(--mu)}.star.fav{color:var(--gold)}
.sq{width:44px;padding:0;flex:none}
.mu{color:var(--mu);font-size:14px}
.h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:18px 4px 4px}
.empty{text-align:center;color:var(--mu);padding:36px 16px;line-height:1.5}
.note{background:var(--goldbg);border:1px solid rgba(242,179,61,.45);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:14px;line-height:1.4}
/* inicio */
.hero{position:relative;padding:18px 12px 6px;text-align:center}
.hero img{width:min(84%,460px);margin:22px auto 8px;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.hero .hb{position:absolute;top:10px;border:0;background:transparent;width:52px;height:52px;padding:0}
.hero .hb .ic{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.dot{position:absolute;top:10px;right:9px;width:11px;height:11px;border-radius:50%;background:#ffb02e;box-shadow:0 0 6px #ffb02e}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:150px 14px 0}
.tiles button{flex-direction:column;gap:6px;min-height:96px;border-radius:20px;background:rgba(30,30,34,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:15px;padding:10px 4px}
.tiles button .ic{width:34px;height:34px}
.tiles button.on{border-color:var(--gold);box-shadow:0 0 18px rgba(242,179,61,.35),inset 0 0 12px rgba(242,179,61,.15);background:rgba(60,40,10,.55)}
.tiles button.on .ic{color:var(--gold)}
@media(max-width:420px){.tiles{gap:7px;padding-top:110px}.tiles button{font-size:13px;min-height:84px}.tiles button .ic{width:28px;height:28px}}
.evc{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.035);border:1px solid var(--bd);border-radius:18px;padding:10px;cursor:pointer}
.datebox{width:92px;flex:none;text-align:center;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--bd);padding:8px 0;line-height:1.05}
.datebox small{display:block;font-size:15px;font-weight:600;color:var(--mu)}
.datebox b{display:block;font-size:38px}
.evc .info{flex:1;min-width:0;border-left:3px solid var(--gold);padding-left:12px;display:grid;gap:6px}
.evc .info div{display:flex;gap:8px;align-items:center;overflow:hidden}
.evc .info .ic{color:var(--gold);width:20px;height:20px}
.link{color:var(--gold2);background:none;border:0;padding:0;min-height:0;justify-content:flex-start;text-align:left}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(12,12,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;flex-direction:column;gap:3px;border:0;background:transparent;min-height:62px;font-size:13px;color:var(--tx);border-radius:14px;position:relative}
.nav button.on{color:var(--gold)}
.nav button.on::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:7;width:62px;height:62px;border-radius:50%;padding:0;box-shadow:0 6px 18px rgba(242,179,61,.35)}
.fab .ic{width:30px;height:30px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:6px 14px;border-radius:20px}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;min-height:40px;background:transparent;font-size:15px;padding:8px 6px}
.seg button.on{background:var(--goldbg);color:var(--gold2)}
/* lector */
#wrap{padding:14px 16px 40vh;overflow-x:auto}
#wrap pre,.stg pre{margin:0;font-family:inherit}
pre.cl{white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
pre.rh{white-space:pre;line-height:1.45}
.dw{position:relative;display:inline-block;min-width:100%}
.dw svg.dov{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dw.drawing svg.dov{pointer-events:auto;touch-action:none}
.tools{position:sticky;top:65px;z-index:4;background:rgba(5,5,7,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.tools button{min-height:40px;padding:6px 10px}
.cdot{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0;min-height:0}
.cdot.on{border-color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(5,5,7,.92);border-top:1px solid var(--bd);z-index:6}
.foot button{flex:1}
.notes{margin:18px 16px;max-width:720px}
.notes textarea{min-height:120px}
/* hojas y menús */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#111114;border:1px solid var(--bd);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.drawer{position:fixed;inset:0 auto 0 0;width:min(300px,84vw);background:#0d0d10;border-right:1px solid var(--bd);z-index:21;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;overflow:auto}
.drawer img{width:80%;margin:6px auto 18px;display:block}
.drawer button{width:100%;justify-content:flex-start;border:0;background:transparent;font-size:17px;min-height:52px}
.drawer button .ic{color:var(--gold)}
/* escenario */
.stg{position:fixed;inset:0;z-index:8;background:#000;color:#f4efe6;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px)}
.stg.light{background:#fff;color:#111}
.stg pre.cl{line-height:1.35}.stg pre.rh{line-height:1.45}
.stg h2{margin:0 0 .4em;color:var(--gold);line-height:1.15}
.stg.light h2{color:#a4620a}
.stg.fit{overflow:hidden}
#fb{margin:0 auto}
.stg section{padding:22px 0 34px;border-bottom:1px dashed rgba(128,128,128,.35)}
.stg section:first-child{padding-top:6px}
.endmk{height:70vh;text-align:center;opacity:.5;padding-top:30px;font-size:24px}
.fm{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.18s;z-index:30;background:#16161a;color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.5);width:min(560px,94vw)}
.fm.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.fm .seg{margin-top:6px}
.hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:31;background:rgba(0,0,0,.8);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;pointer-events:none}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--bd);display:grid;place-items:center;flex:none;font-weight:700}
.chk.on{background:var(--gold);border-color:var(--gold);color:#1b1205}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#1d1d22;border:1px solid var(--gold);color:var(--tx);padding:10px 18px;border-radius:20px;font-size:15px}
/* letra centrada */
.ac{text-align:center}
.ac pre,.ac h2{text-align:center}
.ac .dw{min-width:0}
textarea.ac{text-align:center}
</style>
</head>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const byTitle=(a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'});

/* ---------- íconos ---------- */
const P={home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',music:'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',cal:'M3 6h18v15H3zM3 10h18M8 3v4M16 3v4',list:'M5 3h14v18H5zM9 8l1.5 1.5L13 7M9 14l1.5 1.5L13 13M15 8h2M15 14h2',users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',filter:'M3 4h18l-7 8v7l-4 2v-9z',star:'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z',more:'M12 5h.01M12 12h.01M12 19h.01',plus:'M12 5v14M5 12h14',pin:'M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',calplus:'M3 6h18v15H3zM3 10h18M8 3v4M16 3v4M12 13v6M9 16h6',bell:'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0',menu:'M4 6h16M4 12h16M4 18h16',back:'M15 18l-6-6 6-6',chev:'M9 18l6-6-6-6',share:'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',wa:'M3.5 20.5l1.4-4.3A8.5 8.5 0 1 1 8 19.3zM9 8.5c0 3.5 3 6.5 6.5 6.5l1.2-1.5-2-1-1 .8a5 5 0 0 1-2.5-2.5l.8-1-1-2z',phone:'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6',hl:'M9 11l-6 6v3h9l3-3M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4',eraser:'M7 21h13M5.5 17.5l-2-2a2 2 0 0 1 0-2.8L13 3.2a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L10 20H7zM9 9l6 6',undo:'M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11',play:'M7 4l13 8-13 8z',pause:'M7 4h3v16H7zM14 4h3v16h-3z',full:'M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3',hand:'M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15',copy:'M9 9h11v11H9zM5 15H4V4h11v1',dl:'M12 3v12M7 10l5 5 5-5M5 21h14',up:'M18 15l-6-6-6 6',down:'M6 9l6 6 6-6',x:'M18 6L6 18M6 6l12 12',check:'M20 6L9 17l-5-5',note:'M4 4h16v11l-5 5H4zM15 20v-5h5',alignL:'M3 6h18M3 12h11M3 18h15',alignC:'M3 6h18M6.5 12h11M4.5 18h15',dup:'M8 8h12v12H8zM4 16V4h12'};
const ic=(n,cls,fill)=>'<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="'+(n==='more'?3:2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>';

/* ---------- datos ---------- */
const LS='letras.v1',LST='letras.stageTheme',LB='letras.lastBackup';
let S={songs:{},events:{},contacts:{}};
const ui={view:'home',tab:'home',stack:[],q:'',filter:'all',songId:null,eventId:null,fromEvent:null,ctx:null,ver:'clean',draft:null,tool:'move',color:'#ff5a4e',auto:false,speed:35,st:null,sfs:32,cgrp:'int',cq:'',setEv:null};
try{const f=+localStorage.getItem('letras.sfs');if(f)ui.sfs=f}catch(e){}
const GENRES=['Chacarera','Zamba','Chamamé','Gato','Carnavalito','Cueca','Vidala','Escondido','Huayno','Malambo','Litoraleña','Rasguido doble','Polca','Bailecito','Takirari','Balada','Cumbia','Popurrí'];
function guessGenre(t){t=norm(t);
  const R=[[/chacarera|chacrera/,'Chacarera'],[/zamba|samba/,'Zamba'],[/chamam/,'Chamamé'],[/\bgato\b/,'Gato'],[/carnavalito|taquirar|takirari/,'Carnavalito'],[/cueca/,'Cueca'],[/vidala/,'Vidala'],[/escondido/,'Escondido'],[/huayno/,'Huayno'],[/malambo/,'Malambo'],[/litoral/,'Litoraleña'],[/polca/,'Polca'],[/bailecito/,'Bailecito']];
  for(const [r,g] of R)if(r.test(t))return g;return'';}

/* guardado: solo en este aparato (IndexedDB) */
const DBN='letras',STO='kv',KEY='state';
let dbh=null,store='loading',persisted=false,saveT=null,dirty=false;
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('sin IndexedDB'));const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STO);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(k){return new Promise((res,rej)=>{const q=dbh.transaction(STO).objectStore(STO).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=dbh.transaction(STO,'readwrite');tx.objectStore(STO).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function persistNow(){
  clearTimeout(saveT);saveT=null;if(!dirty)return;dirty=false;
  try{if(dbh)await idbPut(KEY,S);else localStorage.setItem(LS,JSON.stringify(S));if(store==='error')store=dbh?'ok':'ls'}
  catch(e){dirty=true;store='error';toast('⚠️ No se pudo guardar el último cambio')}
}

function lastBackup(){try{return +localStorage.getItem(LB)||0}catch(e){return 0}}

function packFile(name,data){return{name,blob:new Blob([JSON.stringify(Object.assign({app:'albores',formato:2,exportado:new Date().toISOString()},data))],{type:'application/json'})}}
function backupFile(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return packFile('albores-respaldo-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json',{songs:Object.values(S.songs),events:Object.values(S.events),contacts:Object.values(S.contacts)})}
function parseBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){return null}
  if(!d||typeof d!=='object')return null;
  const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
  const sg=arr(d.songs).filter(x=>x&&x.id&&typeof x.title==='string').map(x=>Object.assign({},x,{type:'song',text:String(x.text||''),genre:String(x.genre||''),reh:x.reh&&typeof x.reh==='object'?{text:x.reh.text==null?null:String(x.reh.text),draw:Array.isArray(x.reh.draw)?x.reh.draw:[],notes:String(x.reh.notes||'')}:{text:null,draw:[],notes:''}}));
  const ev=arr(d.events).filter(x=>x&&x.id).map(x=>Object.assign({},x,{type:'event',name:String(x.name||''),date:String(x.date||''),time:String(x.time||''),place:String(x.place||''),notes:String(x.notes||''),ver:x.ver==='reh'?'reh':'clean',songs:Array.isArray(x.songs)?x.songs.map(String):[]}));
  const ct=arr(d.contacts).filter(x=>x&&x.id&&x.name).map(x=>Object.assign({},x,{type:'contact',grp:['int','staff','ev'].includes(x.grp)?x.grp:'int',name:String(x.name),role:String(x.role||''),phone:String(x.phone||''),notes:String(x.notes||'')}));
  if(!sg.length&&!ev.length&&!ct.length)return null;
  return {songs:sg,events:ev,contacts:ct};
}
function planImport(b){
  const r={s:[0,0],e:[0,0],c:[0,0]};
  const look=(list,map,k)=>list.forEach(it=>{const l=map[it.id];if(!l){if(!it.deleted)r[k][0]++}else if((it.upd||0)>(l.upd||0))r[k][1]++});
  look(b.songs,S.songs,'s');look(b.events,S.events,'e');look(b.contacts,S.contacts,'c');return r;
}
function applyImport(b){
  const put=(list,map)=>list.forEach(it=>{const l=map[it.id];if(!l||(it.upd||0)>(l.upd||0))map[it.id]=it});
  put(b.songs,S.songs);put(b.events,S.events);put(b.contacts,S.contacts);migrate();dirty=true;return persistNow();
}
function describePlan(r){
  const P=(n,a,b)=>n+' '+(n>1?b:a),parts=[];
  if(r.s[0])parts.push(P(r.s[0],'canción nueva','canciones nuevas'));if(r.s[1])parts.push(P(r.s[1],'canción actualizada','canciones actualizadas'));
  if(r.e[0])parts.push(P(r.e[0],'evento nuevo','eventos nuevos'));if(r.e[1])parts.push(P(r.e[1],'evento actualizado','eventos actualizados'));
  if(r.c[0])parts.push(P(r.c[0],'contacto nuevo','contactos nuevos'));if(r.c[1])parts.push(P(r.c[1],'contacto actualizado','contactos actualizados'));
  return parts.join(', ');
}

    +'<div class="h">Guardar una copia</div><p class="mu" style="margin:4px 0 8px">Un archivo con todo: canciones, versiones de ensayo, dibujos, eventos y contactos. Guardalo en Drive, mandalo por WhatsApp o pasalo a otro aparato.</p>'
    +'<p><button class="pri" style="width:100%" id="bk-share">'+ic('share')+' Compartir / guardar respaldo</button></p>'
    +'<div class="h">Cargar una copia</div><p class="mu" style="margin:4px 0 8px">Elegí un archivo de respaldo o un evento que te mandaron. Se suma a lo que ya tenés: no se borra nada, y si algo está en los dos lados queda la versión más nueva.</p>'

    +'<p><button style="width:100%" id="bk-close">Cerrar</button></p>',()=>render());

const LH='letras.tapHint';
function setupTap(){
  const w=$('#wrap');if(!w)return;
  w.addEventListener('click',e=>{
    if(ui.tool!=='move'||readerIds().length<2)return;
    const d=tapSide(e.clientX,window.innerWidth);if(d)readerStep(d);
  });
  let seen=false;try{seen=!!localStorage.getItem(LH)}catch(e){}
  if(!seen&&readerIds().length>1){try{localStorage.setItem(LH,'1')}catch(e){}toast('Tocá a la derecha para pasar a la siguiente, a la izquierda para volver')}
}

/* ---------- lector: dibujo (versión de ensayo) ---------- */
let cur=null,curEl=null;
function setupDraw(){
  sizeSvgs();const w=$('#wrap .dw');if(!w)return;
  w.classList.toggle('drawing',ui.tool!=='move');
  const svg=w.querySelector('svg');
  svg.onpointerdown=pd;svg.onpointermove=pm;svg.onpointerup=pu;svg.onpointercancel=pu;
}
function emPt(e){const w=$('#wrap .dw'),b=w.getBoundingClientRect(),fs=parseFloat(getComputedStyle(w).fontSize);return[+((e.clientX-b.left)/fs).toFixed(3),+((e.clientY-b.top)/fs).toFixed(3)]}
function pd(e){
  if(ui.tool==='move')return;e.preventDefault();try{e.target.setPointerCapture(e.pointerId)}catch(x){}
  const p=emPt(e);if(ui.tool==='erase'){cur={erase:true};erase(p);return}
  cur={c:ui.color,w:ui.tool==='hl'?0.9:0.1,a:ui.tool==='hl'?0.35:1,p:p.slice()};
  const g=$('#wrap .dw svg g');g.insertAdjacentHTML('beforeend',svgPaths([cur]));curEl=g.lastElementChild;
}
function pm(e){if(!cur)return;e.preventDefault();const p=emPt(e);if(cur.erase){erase(p);return}cur.p.push(p[0],p[1]);curEl.setAttribute('d',pathD(cur.p))}
function pu(){if(!cur)return;const s=S.songs[ui.songId];if(!cur.erase){s.reh.draw.push(cur);save(s)}cur=null;curEl=null}
function erase(p){
  const s=S.songs[ui.songId];let ch=false;
  s.reh.draw=s.reh.draw.filter(t=>{for(let i=0;i<t.p.length;i+=2){if(Math.hypot(t.p[i]-p[0],t.p[i+1]-p[1])<0.5){ch=true;return false}}return true});
  if(ch){save(s);$('#wrap .dw svg g').innerHTML=svgPaths(s.reh.draw)}
}

function keepAwake(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(l=>{wake=l;l.addEventListener('release',()=>{wake=null})}).catch(()=>{})}catch(e){}}
function stopAuto(){ui.auto=false;if(raf)cancelAnimationFrame(raf);raf=null}
function tick(t){
  if(!ui.auto)return;const el=$('#st');
  if(last){acc+=ui.speed*(t-last)/1000;const d=Math.floor(acc);if(d>0){(el||window).scrollBy(0,d);acc-=d}}
  if(el&&el.scrollTop+el.clientHeight>=el.scrollHeight-2){stopAuto();refreshMenu();return}
  last=t;raf=requestAnimationFrame(tick);
}

  else body='<div id="st" class="'+cls+' scr">'+st.ids.map((id,i)=>{const s=S.songs[id];return '<section data-i="'+i+'" class="'+(s.align==='center'?'ac':'')+'"><h2 style="font-size:'+Math.round(ui.sfs*.75)+'px">'+esc(s.title)+'</h2><div style="font-size:'+ui.sfs+'px">'+textBlock(s,st.ver)+'</div></section>'}).join('')+'<div class="endmk">· · ·</div></div>';
  return body+'<div id="fm" class="fm'+(st.menu?' show':'')+'">'+menuHtml()+'</div>';
}
function doFit(){
  const st=$('#st'),box=$('#fb');if(!st||!box)return;
  const cs=getComputedStyle(st),W=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const reh=ui.st.ver==='reh';
  box.style.width=W+'px';box.style.columnGap='44px';box.style.columnFill='auto';
  const fits=(fs,c)=>{box.style.fontSize=fs+'px';box.style.columnCount=c;box.style.height=c>1?H+'px':'auto';return c>1?box.scrollWidth<=box.clientWidth+1:box.scrollHeight<=H&&box.scrollWidth<=W+1};
  const best=c=>{let lo=8,hi=90;for(let i=0;i<14;i++){const m=(lo+hi)/2;if(fits(m,c))lo=m;else hi=m}return lo};
  let c=1,f=best(1);
  if(!reh&&W>=640&&f<28){const f2=best(2);if(f2>f*1.2){c=2;f=f2}}
  fits(f,c);sizeSvgs(box);
}
function curStageIdx(){
  const st=$('#st');if(!st||ui.st.mode!=='scroll')return;
  let idx=0;st.querySelectorAll('section').forEach((sec,i)=>{if(sec.offsetTop-st.scrollTop<=90)idx=i});
  if(idx!==ui.st.idx){ui.st.idx=idx;ui.songId=ui.st.ids[idx];const t=$('#fm-t');if(t)t.innerHTML=menuHtml().match(/<div id="fm-t"[^>]*>([\s\S]*?)<\/div>/)[1]}
}
function stageAfter(){
  const st=$('#st');if(!st)return;keepAwake();
  if(ui.st.mode==='fit')doFit();
  else{sizeSvgs(st);const sec=st.querySelector('section[data-i="'+ui.st.idx+'"]');if(sec)st.scrollTop=sec.offsetTop;
    let tk=0;st.addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;curStageIdx()})},{passive:true})}
  if(ui.auto&&ui.st.mode==='scroll')startAuto();
  let x0=null,sw=0;
  st.addEventListener('click',e=>{if(Date.now()-sw<400)return;
    const d=ui.st.ids.length>1&&!ui.st.menu?tapSide(e.clientX,window.innerWidth):0;
    if(d){stStep(d);return}
    ui.st.menu=!ui.st.menu;$('#fm').classList.toggle('show',ui.st.menu)});
  st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',e=>{if(ui.st.mode!=='fit'||x0===null||ui.st.ids.length<2)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70){sw=Date.now();stStep(dx<0?1:-1)}});
  if(ui.st.hint){ui.st.hint=false;const h=document.createElement('div');h.className='hint';h.textContent=ui.st.ids.length>1?'Toque a la derecha: siguiente · izquierda: anterior · centro: menú':'Tocá la pantalla para ver el menú';document.body.appendChild(h);setTimeout(()=>h.remove(),3500)}
}
function stStep(d){
  const st=ui.st,n=st.idx+d;if(n<0||n>=st.ids.length)return;

function icsFor(e){
  const p=n=>String(n).padStart(2,'0'),x=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const d=e.date.replace(/-/g,''),now=new Date(),stamp=now.getUTCFullYear()+p(now.getUTCMonth()+1)+p(now.getUTCDate())+'T'+p(now.getUTCHours())+p(now.getUTCMinutes())+'00Z';
  let start,end;
  if(e.time){const [h,mi]=e.time.split(':').map(Number);const [y,mo,dd]=e.date.split('-').map(Number);const s=new Date(y,mo-1,dd,h,mi),en=new Date(s.getTime()+3*36e5);const f=t=>t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'T'+p(t.getHours())+p(t.getMinutes())+'00';start='DTSTART:'+f(s);end='DTEND:'+f(en)}
  else{const [y,mo,dd]=e.date.split('-').map(Number);const n=new Date(y,mo-1,dd+1);start='DTSTART;VALUE=DATE:'+d;end='DTEND;VALUE=DATE:'+n.getFullYear()+p(n.getMonth()+1)+p(n.getDate())}
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Albores//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+e.id+'@albores','DTSTAMP:'+stamp,start,end,'SUMMARY:'+x('Albores — '+(e.name||'Evento')),e.place?'LOCATION:'+x(e.place):'','DESCRIPTION:'+x(eventText(e)),'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:'+x(e.name||'Evento'),'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}

async function addFiles(files){
  const list=[...files];if(!list.length)return;
  const read=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r({t:f.name.replace(/\.[^.]+$/,''),x:String(fr.result||'').replace(/\r\n?/g,'\n')});fr.onerror=()=>r(null);fr.readAsText(f)});
  const got=(await Promise.all(list.map(read))).filter(Boolean);
  if(got.length===1&&ui.draft){if(!ui.draft.title.trim())ui.draft.title=got[0].t;if(!ui.draft.genre)ui.draft.genre=guessGenre(got[0].t);ui.draft.text=got[0].x;render();return}
  got.forEach(g=>{const s={type:'song',id:uid(),title:g.t,text:g.x,genre:guessGenre(g.t),fs:24,reh:{text:null,draw:[],notes:''}};S.songs[s.id]=s;save(s)});
  toast(got.length+' canciones agregadas');ui.stack=[];go('songs');
}

    shareFile('albores-'+e.date+'.ics',new Blob([icsFor(e)],{type:'text/calendar'}),e.name||'Evento')},
  dup:()=>{const e=S.events[ui.eventId];const n=newEvent((e.name||'Evento')+' (copia)','',e.songs.slice(),{time:e.time,place:e.place,notes:e.notes,ver:e.ver,org:e.org});ui.eventId=n.id;render();toast('Evento duplicado: poné la fecha nueva')},
  'del-ev':async()=>{const e=S.events[ui.eventId];if(!await ask('¿Eliminar el evento “'+(e.name||'sin nombre')+'”? Las canciones no se borran.'))return;e.deleted=true;e.songs=[];save(e);back()},
  cgrp:t=>{ui.cgrp=t.dataset.v;render()},
  'new-ct':()=>editContact(null),
  'edit-ct':t=>editContact(S.contacts[t.dataset.id])
};
function keep(a){const y=window.scrollY;render(a);window.scrollTo(0,y)}
function openPicker(){
  const p={sel:[],q:''};
  const m=modal('<h2>Agregar canciones</h2><input type="search" id="pq" placeholder="Buscar…" autocomplete="off"><p class="mu">Se agregan en el orden en que las vas tocando.</p><div id="pl"></div><div class="row" style="margin-top:8px;position:sticky;bottom:0;background:#111114;padding-top:8px"><button style="flex:1" id="pc">Cancelar</button><button class="pri" style="flex:2" id="pa">Agregar</button></div>');
  const rows=()=>{const e=S.events[ui.eventId],n=norm(p.q.trim());const list=songs().filter(s=>!n||norm(s.title).includes(n)).sort(byTitle);
    if(!list.length)return'<div class="empty">No hay canciones.</div>';
    return list.map(s=>{const k=p.sel.indexOf(s.id);return '<div class="item" data-pk="'+s.id+'"><div class="t"><b>'+esc(s.title)+'</b><small>'+esc(s.genre||'')+(e.songs.includes(s.id)?' · ya está en este evento':'')+'</small></div><span class="chk '+(k>=0?'on':'')+'">'+(k>=0?k+1:'')+'</span></div>'}).join('')};
  const upd=()=>{m.el.querySelector('#pl').innerHTML=rows();m.el.querySelector('#pa').textContent='Agregar'+(p.sel.length?' ('+p.sel.length+')':'')};
  upd();
  m.el.querySelector('#pq').oninput=e=>{p.q=e.target.value;upd()};
  m.el.querySelector('#pl').onclick=e=>{const r=e.target.closest('[data-pk]');if(!r)return;const id=r.dataset.pk,i=p.sel.indexOf(id);if(i>=0)p.sel.splice(i,1);else p.sel.push(id);upd()};
  m.el.querySelector('#pc').onclick=m.close;
  m.el.querySelector('#pa').onclick=()=>{const e=S.events[ui.eventId];p.sel.forEach(id=>{if(!e.songs.includes(id))e.songs.push(id)});save(e);m.close();render()};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  if(t.closest('.ov')&&!t.closest('.drawer')&&!t.closest('.sheet'))return;
  const f=A[t.dataset.a];if(f){e.stopPropagation();f(t)}
});
document.addEventListener('input',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='q'){ui.q=v;$('#res').innerHTML=songResults()}
  else if(id==='cq'){ui.cq=v;const p=e.target.selectionStart;render();const n=$('#cq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}
  else if(id==='d-title')ui.draft.title=v;
  else if(id==='d-genre')ui.draft.genre=v;
  else if(id==='d-text')ui.draft.text=v;
  else if(id==='r-notes'){const s=S.songs[ui.songId];s.reh.notes=v;save(s)}
  else if(/^e-(name|date|time|place|notes)$/.test(id)){const ev=S.events[ui.eventId];ev[id.slice(2)]=v;save(ev);if(id==='e-name'){const h=$('.top h1');if(h)h.textContent=v||'Evento'}}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='d-file')addFiles(e.target.files);
  else if(id==='e-org'){const ev=S.events[ui.eventId];ev.org=e.target.value||null;save(ev);keep()}
  else if(id==='set-ev'){ui.setEv=e.target.value;render()}
});

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
boot();
})();
</script>
</body>
</html>
